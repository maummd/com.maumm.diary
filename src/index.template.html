<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3A6894">
<title>마음 다이어리 1년</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: phone-first app shell — sticky header + tab bar, one view at a time, cards only for sessions */
:root{
  --bg:#F3F6F2; --surface:#FFFFFF; --ink:#22303D; --soft:#55626F; --line:#DCE3DC;
  --blue:#3A6894; --blue-bg:#E3ECF5; --orange:#B85A24; --orange-bg:#FBEBDD; --green:#2F7A56; --green-bg:#E2F1E8;
  --q1:#3A6894; --q2:#8A5BA8; --q3:#B85A24; --q4:#2F7A56;
  --display:'Jua','Noto Sans KR',sans-serif; --body:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151C22; --surface:#1F2830; --ink:#E8EDF1; --soft:#A7B3BE; --line:#33404B;
  --blue:#8DB4DC; --blue-bg:#22344A; --orange:#E8A06F; --orange-bg:#3B2A1E; --green:#7FC9A2; --green-bg:#1D3529;
  --q1:#8DB4DC; --q2:#C6A2E0; --q3:#E8A06F; --q4:#7FC9A2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151C22; --surface:#1F2830; --ink:#E8EDF1; --soft:#A7B3BE; --line:#33404B;
  --blue:#8DB4DC; --blue-bg:#22344A; --orange:#E8A06F; --orange-bg:#3B2A1E; --green:#7FC9A2; --green-bg:#1D3529;
  --q1:#8DB4DC; --q2:#C6A2E0; --q3:#E8A06F; --q4:#7FC9A2; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;line-height:1.2}
.sub{color:var(--soft);font-size:13px}
nav{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
nav a{flex:none;text-decoration:none;color:var(--soft);font-weight:700;font-size:15px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav a:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:24px 0 8px;text-wrap:balance}
h3{font-size:17px;margin:0 0 4px}
p{margin:0}
.muted{color:var(--soft);font-size:14px}
.next{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:16px;flex-wrap:wrap}
.next .big{font-family:var(--display);font-size:44px;line-height:1;color:var(--orange);white-space:nowrap}
.next>div{min-width:0;flex:1}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--green)}
.q{margin-top:22px}
.qhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-left:6px solid var(--qc);padding-left:10px}
.qhead h2{margin:0;color:var(--qc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:10px}
.chip{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;font:inherit;color:inherit}
.chip:hover{border-color:var(--qc)}
.chip .n{font-weight:700;color:var(--qc);font-size:13px;font-variant-numeric:tabular-nums}
.chip .t{font-weight:700;line-height:1.35}
.chip .d{font-size:12px;color:var(--soft)}
.chip.done{opacity:.72}
.chip.now{border:2px solid var(--orange);background:var(--orange-bg)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--green-bg);color:var(--green)}
.tag.now{background:var(--orange-bg);color:var(--orange)}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:16px}
.detail .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.detail h2{margin:4px 0 0;font-size:28px}
.sec{margin-top:16px;display:grid;gap:4px}
.sec b{color:var(--blue);font-size:14px}
.ex{background:var(--blue-bg);border-radius:12px;padding:12px 14px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:9px 16px;font:700 15px var(--body);cursor:pointer;text-decoration:none;color:#fff;background:#3A6894}
.btn.spot{background:#1E7A4C}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.pager{display:flex;justify-content:space-between;margin-top:18px;gap:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.weather{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.weather button{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 2px;font:13px var(--body);color:var(--ink);cursor:pointer}
.weather button[aria-pressed="true"]{border:2px solid var(--orange);background:var(--orange-bg)}
.weather svg{width:34px;height:34px}
label{font-weight:700;font-size:14px}
input[type=text],input[type=date],select,textarea{width:100%;font:16px var(--body);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--orange)}
.form{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.score{font-family:var(--display);font-size:28px;color:var(--orange);font-variant-numeric:tabular-nums}
.log{display:grid;gap:8px;margin-top:12px}
.entry{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.entry svg{width:30px;height:30px;flex:none}
.entry>div{min-width:0;flex:1}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;margin-top:12px}
.chart svg{width:100%;height:auto;display:block}
.game{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:14px;text-align:center}
.card-say{font-size:22px;font-weight:700;margin:14px 0;min-height:70px;display:flex;align-items:center;justify-content:center;text-wrap:balance}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choices button{font:700 18px var(--display);padding:14px 4px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.choices .c-e{border-color:var(--orange)} .choices .c-t{border-color:var(--blue)} .choices .c-a{border-color:var(--green)}
.fb{min-height:52px;margin-top:12px;font-size:15px}
.ok{color:var(--green);font-weight:700} .no{color:var(--orange);font-weight:700}
.tri{display:flex;justify-content:center;margin-top:8px}
.note{font-size:13px;color:var(--soft);margin-top:10px}
.pl{display:grid;gap:8px}
.pl .row input{flex:1;min-width:0}
@media (max-width:520px){.next{flex-direction:column;align-items:stretch}.next .btn{justify-content:center}.two{grid-template-columns:1fr}.choices button{font-size:16px}.weather button{font-size:11px}h1{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
html{scroll-padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}[hidden]{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1}
</style>
</head><body>


<div class="wrap">
<header>
  <div class="brand"><div><h1>마음 다이어리 1년</h1><p class="sub">구의 연세정신건강의학과 사회문화센터 · 음악인지재활 48회기</p></div></div>
  <nav aria-label="메뉴">
    <a href="#plan" data-v="plan">1년 플랜</a>
    <a href="#session" data-v="session">회기 보기</a>
    <a href="#diary" data-v="diary">내 다이어리</a>

</header>
<main id="view"></main>
</div>

 sun:['맑음','<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="8" fill="#E9B949"/><g stroke="#E9B949" stroke-width="3" stroke-linecap="round"><path d="M20 3v5M20 32v5M3 20h5M32 20h5M8 8l3 3M29 29l3 3M8 32l3-3M29 11l3-3"/></g></svg>'],

let G=null;

  <div id="rsAsk" hidden><p id="rsMsg" style="margin-top:8px"></p><div class="row" style="margin-top:8px"><button class="btn" type="button" id="rsOk">불러오기</button><button class="btn ghost" type="button" id="rsNo">취소</button></div></div></div>

    try{const o=JSON.parse(await f.text());if(o.app!=='maum-diary'||!o.data)throw 0;pending=o.data;
      const n=Array.isArray(o.data.log)?o.data.log.length:0;document.getElementById('rsMsg').textContent=`${o.savedAt?o.savedAt.slice(0,10)+' 백업 · ':''}다이어리 ${n}개 기록. 지금 휴대폰의 기록을 이 파일 내용으로 바꿔요.`;document.getElementById('rsAsk').hidden=false}
    catch(err){toast('마음 다이어리 백업 파일이 아니에요')}};

// ---------- 파일에서 불러오기 (공용 도구 lib/maumm-reader.js) ----------
function loadReader(){if(window.MReader)return Promise.resolve(window.MReader);return new Promise((res,rej)=>{const s=document.createElement('script');s.src=new URL('lib/maumm-reader.js',location.href).href;s.onload=()=>res(window.MReader);s.onerror=()=>rej(new Error('파일 읽기 도구를 불러오지 못했어요 — 인터넷 연결을 확인해 주세요'));document.head.appendChild(s)})}
const PL_NAMES=['힘낼 때','마음 가라앉힐 때','잠들 때'];
const plSlot=v=>{v=String(v||'');return /힘|에너지|활력|기운|신나|아침/.test(v)?0:/가라앉|진정|불안|화|차분|안정|위로/.test(v)?1:/잠|수면|밤|휴식|자기 전/.test(v)?2:-1};
async function impSongs(){let MR;try{MR=await loadReader()}catch(e){toast(e.message);return}
  MR.importWizard({title:'노래 목록 불러오기',applyLabel:'플레이리스트에 넣기',toast,
    hint:'‘언제’ 칸에 힘 · 가라앉힘(진정 · 불안) · 잠 같은 말이 있으면 그 자리에, 없으면 빈 자리부터 차례로 넣어요. 세 자리(힘낼 때 · 마음 가라앉힐 때 · 잠들 때)예요.',
    fields:[{key:'song',label:'노래 제목',aliases:['노래','곡','곡명','제목','song'],required:true},{key:'artist',label:'가수',aliases:['가수','아티스트','부른 사람']},{key:'when',label:'언제 듣나요',aliases:['언제','상황','용도','구분','플레이리스트']}],
    onApply(rows){const pl=store.get('pl',['','','']).slice(0,3);while(pl.length<3)pl.push('');let n=0;
      rows.forEach(r=>{const v=r.song+(r.artist?' · '+r.artist:'');let k=plSlot(r.when);if(k<0)k=pl.findIndex(x=>!String(x).trim());if(k<0)return;pl[k]=v;n++});
      store.set('pl',pl);vDiary();return `플레이리스트에 ${n}곡 넣었어요${rows.length>n?` (자리가 3개라 ${rows.length-n}곡은 넣지 못했어요)`:''}`}});
}
const wOf=v=>{v=String(v||'');const k=Object.keys(W).find(k=>W[k][0]===v||k===v);return k||(/맑|해|좋/.test(v)?'sun':/조금|구름 조/.test(v)?'part':/흐|구름/.test(v)?'cloud':/천둥|번개|폭풍/.test(v)?'storm':/비|우울|눈물/.test(v)?'rain':/안개|멍/.test(v)?'fog':'part')};
const score=v=>{const n=Math.round(Number(String(v||'').replace(/[^\d.]/g,'')));return Number.isFinite(n)&&String(v).trim()!==''?Math.max(0,Math.min(10,n)):null};
// ---------- 종이 기록 · 활동지 스캔 (공용 도구 lib/maumm-scan.js) ----------
const MOOD_FORM={id:'mood',name:'마음 날씨 기록지',icon:'🌤️',kind:'text',fields:[{label:'마음 날씨',aliases:['날씨','기분']},{label:'듣기 전 점수',aliases:['듣기 전','전 점수']},{label:'들은 뒤 점수',aliases:['들은 뒤','후 점수','들은 후']},{label:'들은 노래',aliases:['노래','곡']},{label:'한 줄 메모',aliases:['메모','생각','느낌']}]};
function scanDiary(){
  if(!window.MScan){toast('스캔 도구를 불러오지 못했어요');return}
  MScan.open({app:'diary',color:'#E8743B',selfUse:true,forms:[MOOD_FORM,'thought','free','phq9','gad7'],doneMsg:'저장했어요',
    onSave:rec=>{
      if(rec.form==='mood'){const f=rec.fields,iso=rec.date,a=score(f['듣기 전 점수']),b=score(f['들은 뒤 점수']),L=store.get('log',[]),dd=new Date(iso+'T00:00');
        L.push({d:fmt(dd),iso,w:wOf(f['마음 날씨']),a:a==null?(b==null?5:b):a,b:b==null?(a==null?5:a):b,s:(f['들은 노래']||'').trim(),n:((f['한 줄 메모']||'')+(rec.memo?' '+rec.memo:'')).trim()});
        L.sort((x,y)=>String(x.iso||'').localeCompare(String(y.iso||'')));store.set('log',L);if(typeof cloudPush==='function')cloudPush();vDiary();return}
      const l=store.get('scans',[]);l.push(rec);store.set('scans',l.slice(-200))},
    history:{title:'스캔한 활동지 · 검사지',load:()=>store.get('scans',[]),remove:r=>store.set('scans',store.get('scans',[]).filter(x=>x.id!==r.id))}});

async function impLog(){let MR;try{MR=await loadReader()}catch(e){toast(e.message);return}
  MR.importWizard({title:'지난 기록 불러오기',applyLabel:'기록에 넣기',toast,
    hint:'날짜 · 점수(0~10)가 있는 줄을 기록에 더해요. 같은 날짜 · 같은 노래 기록이 이미 있으면 건너뛰어요. 날씨 칸이 없으면 ‘구름 조금’으로 넣어요.',
    fields:[{key:'date',label:'날짜',aliases:['일자','날','회기일'],required:true},{key:'w',label:'마음 날씨',aliases:['날씨','기분','마음']},{key:'a',label:'듣기 전 점수',aliases:['전','듣기 전','사전','before']},
      {key:'b',label:'들은 뒤 점수',aliases:['후','들은 뒤','사후','after']},{key:'s',label:'들은 노래',aliases:['노래','곡','곡명']},{key:'n',label:'한 줄 메모',aliases:['메모','생각','느낌','소감']}],
    onApply(rows){const L=store.get('log',[]);const seen=new Set(L.map(e=>(e.iso||'')+'|'+(e.s||'')));let n=0;
      rows.forEach(r=>{const iso=MR.toDate(r.date);if(!iso)return;const a=score(r.a),b=score(r.b);if(a==null&&b==null&&!r.s&&!r.n)return;

        L.push({d:fmt(dd),iso,w:wOf(r.w),a:a==null?(b==null?5:b):a,b:b==null?(a==null?5:a):b,s:r.s||'',n:r.n||''});n++});
      L.sort((x,y)=>String(x.iso||'').localeCompare(String(y.iso||'')));store.set('log',L);vDiary();return `기록 ${n}개를 넣었어요`}});

// 지우기 전에 한 번 묻기
let logAll=false;
function askDel(title,sub,fn,extra){const bg=document.createElement('div');bg.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
  bg.innerHTML=`<div style="background:#fff;border-radius:18px;padding:20px;max-width:360px;width:100%;color:#222"><p style="margin:0 0 6px;font-weight:700;font-size:17px">${esc(title)}</p><p class="muted" style="margin:0 0 12px">${esc(sub||'')}</p>${extra||''}<p class="muted" style="margin:0 0 14px;font-size:13px">지우면 되돌릴 수 없어요.</p><div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn ghost" type="button" data-no>취소</button><button class="btn" type="button" data-yes style="background:#C0392B;border-color:#C0392B;color:#fff">지우기</button></div></div>`;
  document.body.appendChild(bg);const done=()=>bg.remove();bg.querySelector('[data-no]').onclick=done;bg.onclick=e=>{if(e.target===bg)done()};bg.querySelector('[data-yes]').onclick=()=>{const r=fn(bg);if(r!==false)done()}}
function logClear(){const L=store.get('log',[]);const isoOf=e=>e.iso||'';
  askDel('어떤 기록을 지울까요?',`지금 기록 ${L.length}개`,bg=>{const k=bg.querySelector('input[name=lc]:checked').value,cut=new Date();cut.setDate(cut.getDate()-(k==='30'?30:k==='90'?90:0));const cs=cut.toISOString().slice(0,10);

    `<div style="display:grid;gap:8px;margin-bottom:10px">${[['30','30일보다 지난 기록'],['90','90일보다 지난 기록'],['all','모든 기록']].map(([v,l],i)=>`<label style="display:flex;gap:8px;align-items:center"><input type="radio" name="lc" value="${v}"${i?'':' checked'}> ${l}</label>`).join('')}</div>`)}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200)}
function backup(){
  const t=new Date(),iso=`${t.getFullYear()}${String(t.getMonth()+1).padStart(2,'0')}${String(t.getDate()).padStart(2,'0')}`;
  const data=JSON.stringify({app:'maum-diary',v:1,savedAt:t.toISOString(),data:{cfg:store.get('cfg',{}),log:store.get('log',[]),pl:store.get('pl',['','','']),best:store.get('best',0)}});

  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('백업 파일을 저장했어요')}catch(e){toast('백업 파일을 만들지 못했어요')}

const VIEWS={plan:vPlan,session:vSession,diary:vDiary,game:vGame,setup:()=>{vSetup();acctBind()}};
